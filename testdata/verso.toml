[runtime]
environment = "production"

[site]
name = "Example Publication"
base_url = "https://example.org"

[server]
host = "127.0.0.1"
port = 9090

[database]
url = "./data/verso.db"

[storage.filesystem]
path = "./data/assets"

[cache]
path = "./data/cache"

[ui]
language = "en"
theme = "default"
logo = "/assets/logo.svg"

[features]
math = true
interactive_sections = false

[mcp]
enabled = true
allow_publish = false
