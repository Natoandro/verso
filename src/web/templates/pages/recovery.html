<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Password recovery - Verso</title>
    <link rel="stylesheet" href="/admin/theme.css">
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body class="standalone-page">
    {{> admin_header csrf_token=csrf_token is_authenticated=is_authenticated }}
    <main class="standalone-shell">
      <article class="standalone-card">
        <header class="standalone-header">
          <p class="eyebrow">Account access</p>
          <h1>Password recovery</h1>
          <p>Enter your login and, if the account exists, recovery instructions will be sent.</p>
        </header>
        <form class="standalone-form" method="post" action="/admin/recover">
          <label>Login <input name="login" autocomplete="username" required></label>
          <div class="standalone-actions"><button class="theme-button theme-button-primary" type="submit">Request recovery</button><a class="theme-button theme-button-quiet" href="/admin/login">Back to sign in</a></div>
        </form>
        <footer class="standalone-footer"><span>Need another route in?</span><a href="/admin/recover/complete">Use a recovery token</a></footer>
      </article>
    </main>
  </body>
</html>
