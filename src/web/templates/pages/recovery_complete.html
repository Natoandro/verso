<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Set a new password - Verso</title>
    <link rel="stylesheet" href="/admin/theme.css">
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body class="standalone-page">
    {{> admin_header csrf_token=csrf_token is_authenticated=is_authenticated }}
    <main class="standalone-shell">
      <article class="standalone-card">
        <header class="standalone-header">
          <p class="eyebrow">Account access</p>
          <h1>Set a new password</h1>
          <p>Use the recovery link provided by your administrator to choose a new password.</p>
        </header>
        <form class="standalone-form" method="post" action="/admin/recover/complete">
          <input type="hidden" name="token" value="{{ token }}">
          <label>New password <input type="password" name="new_password" autocomplete="new-password" required></label>
          <label>Confirm new password <input type="password" name="new_password_confirmation" autocomplete="new-password" required></label>
          <div class="standalone-actions"><button class="theme-button theme-button-primary" type="submit">Set password</button><a class="theme-button theme-button-quiet" href="/admin/login">Back to sign in</a></div>
        </form>
        <footer class="standalone-footer"><span>Recovery tokens are single-use.</span><a href="/admin/login">Back to sign in</a></footer>
      </article>
    </main>
  </body>
</html>
