<article
  id="section-{{ section.id }}"
  {{{ oob }}}
  class="section-card {{section.kind}}-section{{#if section.is_preview}} is-preview{{/if}}"
  tabindex="0"
>
  <div class="section-actions">
    <form method="post" action="/admin/editor/section" hx-post="/admin/editor/section" hx-target="#editor" hx-swap="outerHTML" hx-headers='{"x-csrf-token":"{{ csrf_token }}"}'>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="operation" value="move-up">
      <input type="hidden" name="document_id" value="{{ document_id }}">
      <input type="hidden" name="version_id" value="{{ version_id }}">
      <input type="hidden" name="section_id" value="{{ section.id }}">
      <input type="hidden" name="expected_revision" value="{{ revision }}">
      <button class="icon-button icon-button-up" type="submit" aria-label="Move section up" title="Move section up" {{#if section.is_first}}disabled{{/if}}>↑</button>
    </form>
    <form method="post" action="/admin/editor/section" hx-post="/admin/editor/section" hx-target="#editor" hx-swap="outerHTML" hx-headers='{"x-csrf-token":"{{ csrf_token }}"}'>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="operation" value="move-down">
      <input type="hidden" name="document_id" value="{{ document_id }}">
      <input type="hidden" name="version_id" value="{{ version_id }}">
      <input type="hidden" name="section_id" value="{{ section.id }}">
      <input type="hidden" name="expected_revision" value="{{ revision }}">
      <button class="icon-button icon-button-down" type="submit" aria-label="Move section down" title="Move section down" {{#if section.is_last}}disabled{{/if}}>↓</button>
    </form>
    <form method="post" action="/admin/editor/section" hx-post="/admin/editor/section" hx-target="#editor" hx-swap="outerHTML" hx-headers='{"x-csrf-token":"{{ csrf_token }}"}'>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="operation" value="duplicate">
      <input type="hidden" name="document_id" value="{{ document_id }}">
      <input type="hidden" name="version_id" value="{{ version_id }}">
      <input type="hidden" name="section_id" value="{{ section.id }}">
      <input type="hidden" name="expected_revision" value="{{ revision }}">
      <button class="icon-button icon-button-copy" type="submit" aria-label="Duplicate section" title="Duplicate section">⧉</button>
    </form>
    <form method="post" action="/admin/editor/section" hx-post="/admin/editor/section" hx-target="#editor" hx-swap="outerHTML" hx-headers='{"x-csrf-token":"{{ csrf_token }}"}'>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="operation" value="delete">
      <input type="hidden" name="document_id" value="{{ document_id }}">
      <input type="hidden" name="version_id" value="{{ version_id }}">
      <input type="hidden" name="section_id" value="{{ section.id }}">
      <input type="hidden" name="expected_revision" value="{{ revision }}">
      <button class="icon-button icon-button-delete" type="submit" aria-label="Delete section" title="Delete section">×</button>
    </form>
  </div>

  {{#if section.is_preview}}
    <div class="section-card-body section-preview">{{{ section.preview_html }}}</div>
    <a class="section-mode-link" href="/admin/editor?document={{ document_id }}&details={{ details_value }}">Edit section</a>
  {{#else}}
    <div class="section-card-body section-editor">
      <form method="post" action="/admin/editor/section" hx-post="/admin/editor/section" hx-target="#editor" hx-swap="outerHTML" hx-headers='{"x-csrf-token":"{{ csrf_token }}"}'>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="document_id" value="{{ document_id }}">
        <input type="hidden" name="version_id" value="{{ version_id }}">
        <input type="hidden" name="section_id" value="{{ section.id }}">
        <input type="hidden" name="expected_revision" value="{{ revision }}">
        <input type="hidden" name="kind" value="{{ section.kind }}">
        {{#if section.is_text}}
          <div class="growing-textarea">
            <textarea name="markdown" aria-label="Markdown content" spellcheck="false">{{ section.markdown }}</textarea>
          </div>
        {{#else}}
          <div class="image-editor">
            <div class="asset-note">Image upload is not part of this draft editor yet. Use an existing asset name.</div>
            <div class="image-fields">
              <input name="asset" value="{{ section.asset }}" placeholder="Asset name" aria-label="Asset name" required>
              <input name="alt" value="{{ section.alt }}" placeholder="Alt text" aria-label="Alt text" required>
            </div>
            <input name="caption" value="{{ section.caption }}" placeholder="Caption" aria-label="Caption">
            <label class="display-field">Display
              <select name="display">
                <option value="inline" {{#if section.display_inline}}selected{{/if}}>Inline</option>
                <option value="wide" {{#if section.display_wide}}selected{{/if}}>Wide</option>
                <option value="full" {{#if section.display_full}}selected{{/if}}>Full</option>
              </select>
            </label>
          </div>
        {{/if}}
        <div class="section-form-actions">
          <button class="theme-button theme-button-quiet" name="operation" value="update" type="submit">Save section</button>
          <button class="theme-button theme-button-quiet" name="operation" value="preview" type="submit">Save and preview</button>
        </div>
      </form>
    </div>
  {{/if}}
</article>
