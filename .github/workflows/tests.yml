name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepare Zig cache
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Run unit and compile-failure tests
        run: zig build test --summary all

      - name: Run bootstrap verification
        run: zig build verify
